<!-- webform.html -->
<form action="/submit" method="post">
    <label for="username">Username:</label>
    <input
        type="text"
        id="username"
        name="username"
        required
        minlength="3"
        maxlength="30"
        pattern="[A-Za-z0-9_]+"
        title="Username must be 3-30 characters and contain only letters, numbers, or underscores."
    >

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        required
        maxlength="100"
        title="Please enter a valid email address."
    >

    <button type="submit">Submit</button>
</form>
